[tox]
envlist=
    py{311,312,313,314}-d52
    cov
    lint

[gh-actions]
python =
    3.11: py311-d52
    3.12: py312-d52
    3.13: py313-d52
    3.14: py314-d52

[pylama]
skip=example/*
ignore=E1002

[pylama:*/__init__.py]
ignore=C0110,W0401

[pylama:tests/*]
ignore=D

[pylama:*/tests.py]
ignore=D,C0111,E501,C0301

[pylama:*/settings.py]
ignore=E501,C0301

[pytest]
DJANGO_SETTINGS_MODULE=tests.settings
addopts = -sx tests/__init__.py

[testenv]
commands=pytest
deps =
    django~=5.2
    -rrequirements-tests.txt

[testenv:lint]
deps=ruff
commands=ruff check django_markdown

[testenv:cov]
deps =
    coverage
    {[testenv]deps}
commands =
    coverage run -m pytest
    coverage report
